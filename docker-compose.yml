services:
  #python
  backend:
    container_name: Backend
    platform: linux/amd64
    build:
      context: api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      - FLASK_ENV=development

    
  frontend:
    container_name: Animore
    build:
      
      context: ani-app
      dockerfile: DockerFile
    ports:
      - "3000:3000"
    volumes:
      - ./ani-app:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend #makes sure backend loads first