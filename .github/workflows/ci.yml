name: CI

on:
  push:
    branches: [main]
  pull_request:

  permissions:
    contents: read

  jobs:
    api:
      name: API (lint + test)
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: api
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            cache: pip
            cache-dependency-path: api/requirements-dev.txt
        - run: pip install -r requirements-dev.txt
        - run: ruff check app.py tests/
        - run: python -m pytest -v

    web:
      name: Frontend (lint + build)
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ani-app
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: ani-app/package-lock.json
        - run: npm ci
        - run: npm run lint
        - run: npm run build

    docker:
      name: API image build
      needs: [api, web]
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: docker build -t animore-api ./api
